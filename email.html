<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Contact Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.08);
      width: 360px;
    }
    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
      font-weight: 600;
    }
    .form-container input, 
    .form-container textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .form-container input:focus,
    .form-container textarea:focus {
      border-color: #f4c542; /* yellow highlight */
      box-shadow: 0px 0px 5px rgba(244,197,66,0.5);
    }
    .form-container button {
      width: 100%;
      padding: 12px;
      background: #f4c542; /* yellow */
      border: none;
      color: #333;
      font-weight: 600;
      border-radius: 25px; /* rounded */
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }
    .form-container button:hover {
      background: #e6b800; /* darker yellow */
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Contact Us</h2>
    <form id="contact-form">
      <input type="text" name="user_name" placeholder="Your Name" required>
      <input type="email" name="user_email" placeholder="Your Email" required>
      <input type="tel" name="user_phone" placeholder="Your Phone Number" required>
      <input type="text" name="subject" placeholder="Subject" required>
      <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("FfK7r60e5JIudchWL"); // Replace with your EmailJS Public Key
    })();

    document.getElementById("contact-form").addEventListener("submit", function(event) {
      event.preventDefault();
      emailjs.sendForm("service_n1o5mgd", "template_tsqa8qh", this)
        .then(function() {
          alert("Message sent successfully!");
        }, function(error) {
          alert("Failed to send message. Error: " + JSON.stringify(error));
        });
    });
  </script>
</body>
</html>
