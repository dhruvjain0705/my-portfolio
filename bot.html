<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book recomendation – Project Showcase</title>
  <meta name="description" content="Book recomendation project showcase with IBM Watson AI chatbot integration." />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Custom Styling -->
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      line-height: 1.6;
    }
    h1 {
  text-align: center;
  margin: 20px auto; /* top/bottom: 20px, auto left/right */
}

    header {
      padding: 20px;
      text-align: center;
      background: #111;
      border-bottom: 2px solid #4b0082;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .project-image {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
    }

    .description {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #ccc;
    }

    .btns {
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      margin-right: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      background: #4b0082;
      color: #fff;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #8a2be2;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background: #111;
      border-top: 2px solid #4b0082;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  
    <h1>Welcome book Recommendation chat bot </h1>
  <footer>
    © 2025 Dhruv Jain | book recomendation Project
  </footer>

  <!-- Watson Assistant Chatbot -->
  <script>
    window.watsonAssistantChatOptions = {
      integrationID: "07879e10-b975-48a7-a1bc-97dea70cb456", 
      region: "au-syd", 
      serviceInstanceID: "ce786a50-63aa-42ed-9a3b-43abfb6253b6",
      onLoad: async (instance) => { await instance.render(); },

      carbonTheme: {
        baseFontSize: "16px",
        fontFamily: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif",
        primaryBackground: "#0d0d0d",
        primaryHighlight: "#4b0082",  
        primaryText: "#ffffff",
        secondaryBackground: "#1a1a1a",
        secondaryHighlight: "#8a2be2", 
        secondaryText: "#cccccc",
        interactiveFocus: "#ffa500",   
        interactiveLink: "#1e90ff"
      },

      chatOptions: {
        chatName: "Book Bot",
        avatarImageURL: "https://img.icons8.com/color/48/book.png",
        showRestartButton: true,
        openChatByDefault: false,
        greeting: "📚 Welcome to the Book Recommendation Chat Bot! Let’s find your next great read!"
      }
    };

    setTimeout(function(){
      const t=document.createElement("script");
      t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" 
            + (window.watsonAssistantChatOptions.clientVersion || "latest") 
            + "/WatsonAssistantChatEntry.js";
      document.head.appendChild(t);
    });
  </script>
</body>
</html>
